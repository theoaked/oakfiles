[server]
host = "0.0.0.0"
port = 8080
session_timeout_minutes = 30

[mdns]
enabled = true
hostname = ""   # empty = use OS hostname

[paths]
roots = []      # fill with absolute paths, e.g. ["D:\\Files", "E:\\Media"]
zip_download_enabled = true
zip_max_size_mb = 2048

[security]
bcrypt_cost = 12

[media]
# Transcode browser-incompatible video (AVI, MKV, WMV, …) to MP4 on the fly so
# it plays inline instead of forcing a download. Requires ffmpeg installed.
transcode_enabled = true
ffmpeg_path = ""   # empty = use "ffmpeg" found on PATH
