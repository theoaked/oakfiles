{% extends "base.html" %}
{% block title %}Users — OakFiles{% endblock %}

{% block content %}
<div class="page">
  <div class="page__header">
    <h1>User management</h1>
    <button class="btn btn--primary" onclick="showModal('modal-create-user')">
      <svg><use href="#i-users"/></svg>Add user
    </button>
  </div>

  <div id="users-table-container" class="card">
    <p class="hint">Loading…</p>
  </div>
</div>

<!-- Create User Modal -->
<div id="modal-create-user" class="modal" role="dialog" hidden>
  <div class="modal__backdrop" onclick="closeModal('modal-create-user')"></div>
  <div class="modal__box">
    <h2 class="modal__title">Add user</h2>
    <label class="field">
      <span class="field__label">Username</span>
      <input id="new-username" class="field__input" type="text" autocomplete="off">
    </label>
    <label class="field">
      <span class="field__label">Password</span>
      <input id="new-password" class="field__input" type="password" autocomplete="new-password">
    </label>
    <label class="field">
      <span class="field__label">Role</span>
      <select id="new-role" class="field__input">
        <option value="readonly">Read only</option>
        <option value="admin">Admin</option>
      </select>
    </label>
    <div class="modal__actions">
      <button class="btn btn--ghost" onclick="closeModal('modal-create-user')">Cancel</button>
      <button class="btn btn--primary" onclick="createUser()">Create</button>
    </div>
  </div>
</div>

<!-- Edit User Modal -->
<div id="modal-edit-user" class="modal" role="dialog" hidden>
  <div class="modal__backdrop" onclick="closeModal('modal-edit-user')"></div>
  <div class="modal__box">
    <h2 class="modal__title">Edit user</h2>
    <input id="edit-user-id" type="hidden">
    <label class="field">
      <span class="field__label">Username</span>
      <input id="edit-username" class="field__input" type="text">
    </label>
    <label class="field">
      <span class="field__label">New password <span class="muted">(leave blank to keep)</span></span>
      <input id="edit-password" class="field__input" type="password" autocomplete="new-password">
    </label>
    <label class="field">
      <span class="field__label">Role</span>
      <select id="edit-role" class="field__input">
        <option value="readonly">Read only</option>
        <option value="admin">Admin</option>
      </select>
    </label>
    <div class="modal__actions">
      <button class="btn btn--ghost" onclick="closeModal('modal-edit-user')">Cancel</button>
      <button class="btn btn--primary" onclick="saveUser()">Save</button>
    </div>
  </div>
</div>

<!-- Delete User Modal -->
<div id="modal-delete-user" class="modal" role="dialog" hidden>
  <div class="modal__backdrop" onclick="closeModal('modal-delete-user')"></div>
  <div class="modal__box">
    <h2 class="modal__title">Delete user</h2>
    <p class="modal__body" id="delete-user-msg"></p>
    <div class="modal__actions">
      <button class="btn btn--ghost" onclick="closeModal('modal-delete-user')">Cancel</button>
      <button class="btn btn--danger" onclick="confirmDeleteUser()">Delete</button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
async function loadUsers() {
  const c = document.getElementById('users-table-container');
  try {
    const users = await apiJson('GET', '/api/users');
    if (!users.length) { c.innerHTML = '<p class="hint">No users yet.</p>'; return; }
    c.innerHTML = `
      <table class="data-table">
        <thead><tr>
          <th>Username</th><th>Role</th><th class="hide-mobile">Created</th><th>Status</th><th></th>
        </tr></thead>
        <tbody>${users.map(u => `
          <tr>
            <td>${escHtml(u.username)}</td>
            <td><span class="badge badge--${u.role}">${u.role}</span></td>
            <td class="hide-mobile">${u.created_at.slice(0, 10)}</td>
            <td>${u.is_active ? '<span class="badge badge--ok">Active</span>' : '<span class="badge badge--off">Disabled</span>'}</td>
            <td style="text-align:right; white-space:nowrap">
              <button class="btn btn--ghost btn--xs" onclick="editUser(${u.id}, '${escHtml(u.username)}', '${u.role}')">Edit</button>
              <button class="btn btn--danger btn--xs" onclick="askDeleteUser(${u.id}, '${escHtml(u.username)}')">Delete</button>
            </td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  } catch (e) {
    c.innerHTML = `<p class="alert alert--error">${escHtml(e.message)}</p>`;
  }
}

async function createUser() {
  const username = document.getElementById('new-username').value.trim();
  const password = document.getElementById('new-password').value;
  const role = document.getElementById('new-role').value;
  try {
    await apiJson('POST', '/api/users', { username, password, role });
    closeModal('modal-create-user');
    toast(`User "${username}" created.`, 'success');
    loadUsers();
  } catch (e) { toast(e.message, 'error'); }
}

function editUser(id, username, role) {
  document.getElementById('edit-user-id').value = id;
  document.getElementById('edit-username').value = username;
  document.getElementById('edit-role').value = role;
  document.getElementById('edit-password').value = '';
  showModal('modal-edit-user');
}

async function saveUser() {
  const id = document.getElementById('edit-user-id').value;
  const body = {
    username: document.getElementById('edit-username').value.trim(),
    role: document.getElementById('edit-role').value,
  };
  const pw = document.getElementById('edit-password').value;
  if (pw) body.password = pw;
  try {
    await apiJson('PATCH', `/api/users/${id}`, body);
    closeModal('modal-edit-user');
    toast('User updated.', 'success');
    loadUsers();
  } catch (e) { toast(e.message, 'error'); }
}

let _pendingDeleteUserId = null;

function askDeleteUser(id, username) {
  _pendingDeleteUserId = id;
  document.getElementById('delete-user-msg').textContent =
    `Delete user "${username}"? This cannot be undone.`;
  showModal('modal-delete-user');
}

async function confirmDeleteUser() {
  try {
    const res = await fetch(`/api/users/${_pendingDeleteUserId}`, {
      method: 'DELETE', headers: { 'X-CSRF-Token': CSRF },
    });
    if (!res.ok) { const e = await res.json(); throw new Error(e.detail || 'Error'); }
    closeModal('modal-delete-user');
    toast('User deleted.', 'success');
    loadUsers();
  } catch (e) { toast(e.message, 'error'); }
}

window.addEventListener('DOMContentLoaded', loadUsers);
</script>
{% endblock %}
