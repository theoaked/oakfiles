<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <script>
    (function () {
      var t = localStorage.getItem('oakfiles-theme');
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — OakFiles</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%235b7cfa'/%3E%3Cpath d='M16 6c-4 0-7 2.3-7 5.4h14C23 8.3 20 6 16 6z' fill='%23fff'/%3E%3Cpath d='M9.6 13.4c.5 4.6 3.3 7.9 6.4 12.1 3.1-4.2 5.9-7.5 6.4-12.1H9.6z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/static/css/main.css">
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-card__head">
      <span class="brand-mark">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 2C8 2 5 4.4 5 7.6h14C19 4.4 16 2 12 2z"/>
          <path d="M5.7 9.6c.5 5 3.4 8.6 6.3 12.4 2.9-3.8 5.8-7.4 6.3-12.4H5.7z"/>
        </svg>
      </span>
      <h1 class="login-card__title">OakFiles</h1>
      <p class="login-card__sub">Sign in to browse your files</p>
    </div>

    {% if error %}
      <p class="alert alert--error">{{ error }}</p>
    {% endif %}

    <form method="post" action="/login" class="login-form">
      <label class="field">
        <span class="field__label">Username</span>
        <input class="field__input" type="text" name="username" autocomplete="username"
               autofocus required>
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="field__input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <button type="submit" class="btn btn--primary btn--full">Sign in</button>
    </form>
  </div>
</body>
</html>
